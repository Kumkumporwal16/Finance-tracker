<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom, #f1f5f9, #d1d5db);
        }
        .transaction-card {
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .transaction-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
        }
        .chart-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .modal-content {
            border-radius: 15px;
        }
        .btn-custom {
            background: linear-gradient(to right, #0d9488, #3b82f6);
            color: white;
            border: none;
        }
        .btn-custom:hover {
            background: linear-gradient(to right, #0b8276, #2563eb);
        }
    </style>
</head>
<body>
    <div id="root" class="container my-5"></div>
    <script type="text/babel">
        function FinanceTracker() {
            const [transactions, setTransactions] = React.useState(JSON.parse(localStorage.getItem('transactions')) || []);
            const [description, setDescription] = React.useState('');
            const [amount, setAmount] = React.useState('');
            const [type, setType] = React.useState('Income');
            const [category, setCategory] = React.useState('Salary');
            const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [editId, setEditId] = React.useState(null);
            const [filterType, setFilterType] = React.useState('');
            const [filterCategory, setFilterCategory] = React.useState('');
            const [filterDateStart, setFilterDateStart] = React.useState('');
            const [filterDateEnd, setFilterDateEnd] = React.useState('');
            const [sortBy, setSortBy] = React.useState('date');
            const [toast, setToast] = React.useState({ show: false, message: '', type: 'success' });
            const pieChartRef = React.useRef(null);
            const lineChartRef = React.useRef(null);

            const categories = ['Salary', 'Freelance', 'Investment', 'Food', 'Bills', 'Travel', 'Entertainment', 'Other'];

            React.useEffect(() => {
                localStorage.setItem('transactions', JSON.stringify(transactions));
                updateCharts();
            }, [transactions]);

            const showToast = (message, type) => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: '' }), 3000);
            };

            const addOrEditTransaction = () => {
                if (!description || !amount || isNaN(amount)) {
                    showToast('Please fill all fields correctly', 'danger');
                    return;
                }
                const transaction = { id: editId || Date.now(), description, amount: parseFloat(amount), type, category, date };
                if (editId) {
                    setTransactions(transactions.map(t => (t.id === editId ? transaction : t)));
                    showToast('Transaction updated', 'success');
                    setEditId(null);
                } else {
                    setTransactions([...transactions, transaction]);
                    showToast('Transaction added', 'success');
                }
                setDescription('');
                setAmount('');
                setType('Income');
                setCategory('Salary');
                setDate(new Date().toISOString().split('T')[0]);
            };

            const startEdit = (t) => {
                setEditId(t.id);
                setDescription(t.description);
                setAmount(t.amount);
                setType(t.type);
                setCategory(t.category);
                setDate(t.date);
                window.editModal.show();
            };

            const deleteTransaction = (id) => {
                setTransactions(transactions.filter(t => t.id !== id));
                showToast('Transaction deleted', 'success');
            };

            const filteredTransactions = transactions
                .filter(t => (filterType ? t.type === filterType : true))
                .filter(t => (filterCategory ? t.category === filterCategory : true))
                .filter(t => (filterDateStart ? new Date(t.date) >= new Date(filterDateStart) : true))
                .filter(t => (filterDateEnd ? new Date(t.date) <= new Date(filterDateEnd) : true))
                .sort((a, b) => {
                    if (sortBy === 'date') return new Date(b.date) - new Date(a.date);
                    if (sortBy === 'amount') return b.amount - a.amount;
                    if (sortBy === 'category') return a.category.localeCompare(b.category);
                    return 0;
                });

            const exportToCSV = () => {
                const csv = ['ID,Description,Amount,Type,Category,Date', ...transactions.map(t =>
                    `${t.id},"${t.description}",${t.amount},${t.type},${t.category},${t.date}`
                )].join('\n');
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'transactions.csv';
                a.click();
                window.URL.revokeObjectURL(url);
                showToast('Transactions exported', 'success');
            };

            const updateCharts = () => {
                const expenseCategories = categories.reduce((acc, cat) => {
                    acc[cat] = transactions
                        .filter(t => t.type === 'Expense' && t.category === cat)
                        .reduce((sum, t) => sum + t.amount, 0);
                    return acc;
                }, {});
                const pieData = {
                    labels: Object.keys(expenseCategories).filter(cat => expenseCategories[cat] > 0),
                    datasets: [{
                        data: Object.values(expenseCategories).filter(val => val > 0),
                        backgroundColor: ['#ff6384', '#36a2eb', '#ffce56', '#4bc0c0', '#9966ff', '#ff9f40', '#c9cbcf', '#6b7280']
                    }]
                };
                if (pieChartRef.current) pieChartRef.current.destroy();
                pieChartRef.current = new Chart(document.getElementById('pieChart'), {
                    type: 'pie',
                    data: pieData,
                    options: { responsive: true, plugins: { legend: { position: 'top' }, title: { display: true, text: 'Expenses by Category' } } }
                });

                const sortedDates = [...new Set(transactions.map(t => t.date))].sort();
                const balanceData = sortedDates.map(date => {
                    const balance = transactions
                        .filter(t => new Date(t.date) <= new Date(date))
                        .reduce((sum, t) => sum + (t.type === 'Income' ? t.amount : -t.amount), 0);
                    return balance;
                });
                const lineData = {
                    labels: sortedDates,
                    datasets: [{ label: 'Balance', data: balanceData, borderColor: '#36a2eb', fill: false }]
                };
                if (lineChartRef.current) lineChartRef.current.destroy();
                lineChartRef.current = new Chart(document.getElementById('lineChart'), {
                    type: 'line',
                    data: lineData,
                    options: { responsive: true, plugins: { title: { display: true, text: 'Balance Over Time' } }, scales: { x: { title: { display: true, text: 'Date' } }, y: { title: { display: true, text: 'Balance' } } } }
                });
            };

            React.useEffect(() => {
                window.editModal = new bootstrap.Modal(document.getElementById('editModal'));
            }, []);

            return (
                <div className="card p-4 shadow-lg">
                    <h1 className="text-3xl font-bold mb-4 text-center text-teal-900">Personal Finance Tracker</h1>
                    <div className="row g-3 mb-4">
                        <div className="col-md-3">
                            <input
                                type="text"
                                className="form-control"
                                value={description}
                                onChange={(e) => setDescription(e.target.value)}
                                placeholder="Description"
                            />
                        </div>
                        <div className="col-md-2">
                            <input
                                type="number"
                                className="form-control"
                                value={amount}
                                onChange={(e) => setAmount(e.target.value)}
                                placeholder="Amount"
                            />
                        </div>
                        <div className="col-md-2">
                            <select className="form-select" value={type} onChange={(e) => setType(e.target.value)}>
                                <option>Income</option>
                                <option>Expense</option>
                            </select>
                        </div>
                        <div className="col-md-2">
                            <select className="form-select" value={category} onChange={(e) => setCategory(e.target.value)}>
                                {categories.map(cat => <option key={cat}>{cat}</option>)}
                            </select>
                        </div>
                        <div className="col-md-2">
                            <input
                                type="date"
                                className="form-control"
                                value={date}
                                onChange={(e) => setDate(e.target.value)}
                            />
                        </div>
                        <div className="col-md-1">
                            <button className="btn btn-custom w-100" onClick={addOrEditTransaction}>
                                {editId ? 'Update' : 'Add'}
                            </button>
                        </div>
                    </div>
                    <div className="row g-3 mb-4">
                        <div className="col-md-2">
                            <select className="form-select" value={filterType} onChange={(e) => setFilterType(e.target.value)}>
                                <option value="">All Types</option>
                                <option>Income</option>
                                <option>Expense</option>
                            </select>
                        </div>
                        <div className="col-md-2">
                            <select className="form-select" value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)}>
                                <option value="">All Categories</option>
                                {categories.map(cat => <option key={cat}>{cat}</option>)}
                            </select>
                        </div>
                        <div className="col-md-2">
                            <input
                                type="date"
                                className="form-control"
                                value={filterDateStart}
                                onChange={(e) => setFilterDateStart(e.target.value)}
                                placeholder="Start Date"
                            />
                        </div>
                        <div className="col-md-2">
                            <input
                                type="date"
                                className="form-control"
                                value={filterDateEnd}
                                onChange={(e) => setFilterDateEnd(e.target.value)}
                                placeholder="End Date"
                            />
                        </div>
                        <div className="col-md-2">
                            <select className="form-select" value={sortBy} onChange={(e) => setSortBy(e.target.value)}>
                                <option value="date">Sort by Date</option>
                                <option value="amount">Sort by Amount</option>
                                <option value="category">Sort by Category</option>
                            </select>
                        </div>
                        <div className="col-md-2">
                            <button className="btn btn-custom w-100" onClick={exportToCSV}>Export CSV</button>
                        </div>
                    </div>
                    <div className="row">
                        {filteredTransactions.map(t => (
                            <div key={t.id} className="col-md-4 mb-3">
                                <div className="card transaction-card p-3">
                                    <h5>{t.description}</h5>
                                    <p className="text-muted">{t.type}: ₹{t.amount.toFixed(2)}</p>
                                    <p className="text-muted">Category: {t.category}</p>
                                    <p className="text-muted">Date: {t.date}</p>
                                    <div className="d-flex gap-2">
                                        <button className="btn btn-outline-primary btn-sm" onClick={() => startEdit(t)}>Edit</button>
                                        <button className="btn btn-outline-danger btn-sm" onClick={() => deleteTransaction(t.id)}>Delete</button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="mt-5">
                        <h2 className="text-2xl font-bold mb-4 text-center text-teal-900">Analytics</h2>
                        <div className="row">
                            <div className="col-md-6 mb-4">
                                <div className="chart-container">
                                    <canvas id="pieChart"></canvas>
                                </div>
                            </div>
                            <div className="col-md-6 mb-4">
                                <div className="chart-container">
                                    <canvas id="lineChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="modal fade" id="editModal" tabIndex="-1">
                        <div className="modal-dialog">
                            <div className="modal-content">
                                <div className="modal-header">
                                    <h5 className="modal-title">Edit Transaction</h5>
                                    <button type="button" className="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div className="modal-body">
                                    <div className="mb-3">
                                        <label className="form-label">Description</label>
                                        <input type="text" className="form-control" value={description} onChange={(e) => setDescription(e.target.value)} />
                                    </div>
                                    <div className="mb-3">
                                        <label className="form-label">Amount</label>
                                        <input type="number" className="form-control" value={amount} onChange={(e) => setAmount(e.target.value)} />
                                    </div>
                                    <div className="mb-3">
                                        <label className="form-label">Type</label>
                                        <select className="form-select" value={type} onChange={(e) => setType(e.target.value)}>
                                            <option>Income</option>
                                            <option>Expense</option>
                                        </select>
                                    </div>
                                    <div className="mb-3">
                                        <label className="form-label">Category</label>
                                        <select className="form-select" value={category} onChange={(e) => setCategory(e.target.value)}>
                                            {categories.map(cat => <option key={cat}>{cat}</option>)}
                                        </select>
                                    </div>
                                    <div className="mb-3">
                                        <label className="form-label">Date</label>
                                        <input type="date" className="form-control" value={date} onChange={(e) => setDate(e.target.value)} />
                                    </div>
                                </div>
                                <div className="modal-footer">
                                    <button type="button" className="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                    <button type="button" className="btn btn-custom" onClick={() => { addOrEditTransaction(); window.editModal.hide(); }}>Save</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    {toast.show && (
                        <div className="toast-container">
                            <div className={`toast align-items-center text-white bg-${toast.type} show`} role="alert">
                                <div className="d-flex">
                                    <div className="toast-body">{toast.message}</div>
                                    <button type="button" className="btn-close btn-close-white me-2 m-auto" onClick={() => setToast({ show: false, message: '', type: '' })}></button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<FinanceTracker />, document.getElementById('root'));
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
